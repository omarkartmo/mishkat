name: Mishkat CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: true
  NODE_ENV: test
  JWT_SECRET: mishkat_ci_test_jwt_secret_key_minimum_32_characters_long_123456

jobs:
  validate:
    name: Validation & Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (deterministic lockfile)
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Run API Integration & Security Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End & Security Regression Tests
        run: npx playwright test

      - name: Upload Playwright Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
